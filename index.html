<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge AI - In-Browser Client-Side AI</title>
    <style>
        /* Dark Theme & McDonald's Soft Dark Green Base */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
            color: #e0e0e0;
            background: #121212; /* Deep black background */
        }
        
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
        }
        
        /* The specific soft dark green (like a muted forest green) */
        h2 { margin: 0; color: #1e5c3e; } 
        
        .sub-title {
            font-size: 13px;
            color: #a0a0a0;
            margin-bottom: 10px;
        }
        
        #upgrade-status {
            font-size: 12px;
            color: #1e5c3e;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }
        
        #token-stats {
            font-size: 12px;
            color: #bbb;
            background: #2a2a2a;
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        #chat-box {
            border: 1px solid #333;
            background: #1e1e1e;
            height: 380px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            word-break: break-word;
            font-size: 14px;
        }
        
        .user { 
            background: #1e5c3e; /* Soft dark green */
            color: #fff; 
            align-self: flex-end; 
        }
        
        .assistant { 
            background: #2a2a2a; 
            color: #e0e0e0; 
            align-self: flex-start; 
            border: 1px solid #333;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #444;
            background: #1e1e1e;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        
        input[type="text"]::placeholder {
            color: #777;
        }
        
        input[type="text"]:focus {
            border-color: #1e5c3e;
        }
        
        button {
            padding: 0 20px;
            background: #1e5c3e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover:not(:disabled) {
            background: #174a31;
        }
        
        button:disabled { 
            background: #333; 
            color: #666;
            cursor: not-allowed; 
        }

        /* Fancy Fullscreen Loading Screen Overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.4s ease;
        }
        
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #333;
            border-top: 4px solid #1e5c3e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #loading-text {
            font-size: 16px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 5px;
            text-align: center;
        }
        
        #loading-subtext {
            font-size: 13px;
            color: #a0a0a0;
            margin-bottom: 20px;
            text-align: center;
            max-width: 80%;
        }
        
        .progress-container {
            width: 280px;
            background: #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            height: 12px;
            margin-bottom: 10px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        
        /* Blue-Green Fade Moving Effect for Progress Bar */
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #1e5c3e, #2b8c73, #1e5c3e);
            background-size: 200% 100%;
            animation: gradientMove 2s linear infinite;
            transition: width 0.2s ease;
        }
        
        @keyframes gradientMove {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
        
        #progress-stats {
            font-size: 13px;
            font-weight: 600;
            color: #888;
        }
        
        /* Custom scrollbar for chat box to match dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <!-- Loading Screen Overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Preparing Forge AI</div>
        <div id="loading-subtext">Loading fast startup model...</div>
        
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="progress-stats">0%</div>
    </div>

    <div class="header-container">
        <h2 id="app-title">Forge AI</h2>
        <div id="token-stats">Context: 0 / 32,768 tokens</div>
    </div>
    <div class="sub-title">Super-fast client-side intelligence running right inside your browser via WebGPU.</div>
    
    <!-- New upgrade status text -->
    <div id="upgrade-status"></div>

    <div id="chat-box"></div>

    <div class="input-group">
        <input type="text" id="user-input" placeholder="Ask Forge AI anything..." disabled>
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>

    <!-- Load WebLLM via ESM CDN -->
    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        let engine = null;
        let backendConfig = null;
        const maxWindow = 32768;

        const loadingOverlay = document.getElementById("loading-overlay");
        const loadingSubtext = document.getElementById("loading-subtext");
        const progressBar = document.getElementById("progress-bar");
        const progressStats = document.getElementById("progress-stats");
        
        const upgradeStatus = document.getElementById("upgrade-status");
        const tokenStats = document.getElementById("token-stats");
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const appTitle = document.getElementById("app-title");

        let conversationHistory = [];

        async function initApp() {
            try {
                // 1. Fetch backend configuration
                const response = await fetch('./prompt-config.json');
                if (!response.ok) throw new Error("Failed to load prompt-config.json");
                backendConfig = await response.json();

                // Override name to Forge AI even if config says Nectar
                appTitle.innerText = "Forge AI";
                document.title = "Forge AI";

                // 2. Load the FAST model first
                const initProgressCallback = (report) => {
                    loadingSubtext.innerText = report.text;
                    if (report.progress !== undefined) {
                        const percent = Math.round(report.progress * 100);
                        progressBar.style.width = percent + "%";
                        progressStats.innerText = percent + "%";
                    }
                };

                engine = await webllm.CreateMLCEngine(
                    backendConfig.model_selection, 
                    { initProgressCallback: initProgressCallback }
                );

                // Hide loading overlay
                loadingOverlay.style.opacity = "0";
                setTimeout(() => {
                    loadingOverlay.style.display = "none";
                }, 400);

                // Enable chat
                userInput.disabled = false;
                sendBtn.disabled = false;

                // 3. Start background download of the SMARTER model
                loadBiggerModel();

            } catch (err) {
                console.error(err);
                loadingSubtext.innerText = "Initialization error.";
                progressStats.innerText = "Error";
            }
        }

        // New function to load the bigger model silently
        async function loadBiggerModel() {
            upgradeStatus.style.display = "block";
            
            const upgradeProgressCallback = (report) => {
                // Clean up the text so it's simple and easy to read
                const shortText = report.text.split("] ")[1] || report.text;
                upgradeStatus.innerText = "Downloading smarter AI in background: " + shortText;
            };

            try {
                // You can change this to a larger Qwen model when available
                const biggerModelName = "Qwen2-1.5B-Instruct-q4f16_1-MLC"; 
                
                const biggerEngine = await webllm.CreateMLCEngine(
                    biggerModelName, 
                    { initProgressCallback: upgradeProgressCallback }
                );

                // Swap the engine to the smarter one seamlessly
                engine = biggerEngine;
                
                upgradeStatus.style.color = "#2b8c73"; // Use the bluish-green for success
                upgradeStatus.innerText = "✨ Upgrade complete! You are now chatting with the smarter AI.";
                
                // Hide the message after 5 seconds
                setTimeout(() => {
                    upgradeStatus.style.display = "none";
                }, 5000);

            } catch (err) {
                console.error("Background upgrade failed:", err);
                upgradeStatus.style.display = "none";
            }
        }

        initApp();

        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text || !engine || !backendConfig) return;

            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            conversationHistory.push({ role: "user", content: text });
            appendMessage(text, "user");

            const messages = [
                { role: "system", content: backendConfig.system_prompt },
                ...conversationHistory
            ];

            const assistantMsgDiv = appendMessage("", "assistant");

            try {
                const replyStream = await engine.chat.completions.create({
                    messages: messages,
                    temperature: backendConfig.temperature,
                    max_tokens: backendConfig.max_output_tokens,
                    stream: true,
                    stream_options: { include_usage: true }
                });

                let fullReply = "";
                let currentUsage = null;

                for await (const chunk of replyStream) {
                    const delta = chunk.choices[0]?.delta?.content || "";
                    fullReply += delta;
                    assistantMsgDiv.innerText = fullReply;
                    chatBox.scrollTop = chatBox.scrollHeight;

                    if (chunk.usage) {
                        currentUsage = chunk.usage;
                    }
                }

                conversationHistory.push({ role: "assistant", content: fullReply });

                if (currentUsage && currentUsage.total_tokens) {
                    const used = currentUsage.total_tokens;
                    const pct = ((used / maxWindow) * 100).toFixed(1);
                    tokenStats.innerText = `Context: ${used.toLocaleString()} / ${maxWindow.toLocaleString()} tokens (${pct}%)`;
                }

            } catch (err) {
                console.error(err);
                assistantMsgDiv.innerText = "[Generation error]";
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>

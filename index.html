<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nectar AI Free - In-Browser Client-Side AI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            background: #fcfcfc;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
        }
        h2 { margin: 0; color: #ff6600; }
        .sub-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }
        #loading-status {
            font-style: italic;
            color: #555;
            font-size: 13px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        #token-stats {
            font-size: 12px;
            color: #777;
            background: #eee;
            padding: 4px 8px;
            border-radius: 4px;
        }
        #chat-box {
            border: 1px solid #ddd;
            background: #fff;
            height: 380px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            word-break: break-word;
            font-size: 14px;
        }
        .user { background: #ff6600; color: white; align-self: flex-end; }
        .assistant { background: #f0f0f0; color: #222; align-self: flex-start; }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ff6600;
        }
        button {
            padding: 0 20px;
            background: #ff6600;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2 id="app-title">Nectar AI Free</h2>
        <div id="token-stats">Context: 0 / 32,768 tokens</div>
    </div>
    <div class="sub-title">Super-fast client-side intelligence running right inside your browser via WebGPU.</div>

    <div id="loading-status">Loading backend configuration & initializing WebLLM...</div>

    <div id="chat-box"></div>

    <div class="input-group">
        <input type="text" id="user-input" placeholder="Ask Nectar AI Free anything..." disabled>
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>

    <!-- Load WebLLM via ESM CDN -->
    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        let engine = null;
        let backendConfig = null;
        const maxWindow = 32768; // Qwen2 token context limit

        const statusDiv = document.getElementById("loading-status");
        const tokenStats = document.getElementById("token-stats");
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const appTitle = document.getElementById("app-title");

        let conversationHistory = [];

        async function initApp() {
            try {
                // 1. Fetch backend configuration json file
                const response = await fetch('./prompt-config.json');
                if (!response.ok) throw new Error("Failed to load prompt-config.json");
                backendConfig = await response.json();

                // Apply branding from backend config
                if (backendConfig.app_name) {
                    appTitle.innerText = backendConfig.app_name;
                    document.title = backendConfig.app_name;
                }

                statusDiv.innerText = `Initializing model (${backendConfig.model_selection})...`;

                // 2. Initialize WebLLM Engine using backend model spec
                const initProgressCallback = (report) => {
                    statusDiv.innerText = report.text;
                };

                engine = await webllm.CreateMLCEngine(
                    backendConfig.model_selection, 
                    { initProgressCallback: initProgressCallback }
                );

                statusDiv.innerText = `${backendConfig.app_name} is ready! (100% Local WebGPU)`;
                userInput.disabled = false;
                sendBtn.disabled = false;

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Initialization error. Ensure prompt-config.json is present and server is running.";
            }
        }

        initApp();

        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text || !engine || !backendConfig) return;

            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Append user text to local history
            conversationHistory.push({ role: "user", content: text });
            appendMessage(text, "user");

            // Build backend payload completely behind the scenes
            const messages = [
                { role: "system", content: backendConfig.system_prompt },
                ...conversationHistory
            ];

            const assistantMsgDiv = appendMessage("", "assistant");

            try {
                const replyStream = await engine.chat.completions.create({
                    messages: messages,
                    temperature: backendConfig.temperature,
                    max_tokens: backendConfig.max_output_tokens,
                    stream: true,
                    stream_options: { include_usage: true }
                });

                let fullReply = "";
                let currentUsage = null;

                for await (const chunk of replyStream) {
                    const delta = chunk.choices[0]?.delta?.content || "";
                    fullReply += delta;
                    assistantMsgDiv.innerText = fullReply;
                    chatBox.scrollTop = chatBox.scrollHeight;

                    if (chunk.usage) {
                        currentUsage = chunk.usage;
                    }
                }

                // Push assistant answer into history
                conversationHistory.push({ role: "assistant", content: fullReply });

                // Update context metrics display cleanly
                if (currentUsage && currentUsage.total_tokens) {
                    const used = currentUsage.total_tokens;
                    const pct = ((used / maxWindow) * 100).toFixed(1);
                    tokenStats.innerText = `Context: ${used.toLocaleString()} / ${maxWindow.toLocaleString()} tokens (${pct}%)`;
                }

            } catch (err) {
                console.error(err);
                assistantMsgDiv.innerText = "[Generation error]";
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>

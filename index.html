<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Kernel AI - In-Browser Client-Side AI</title>
    <style>
        :root,
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --text-subtle: #bbb;
            --accent: #1e5c3e;
            --accent-hover: #174a31;
            --accent-light: #2b8c73;
            --surface: #1e1e1e;
            --surface-raised: #2a2a2a;
            --border: #333;
            --border-input: #444;
            --placeholder: #777;
            --user-msg-bg: #1e5c3e;
            --user-msg-text: #fff;
            --assistant-msg-bg: #2a2a2a;
            --assistant-msg-text: #e0e0e0;
            --btn-disabled-bg: #333;
            --btn-disabled-text: #666;
            --scrollbar-track: #1e1e1e;
            --scrollbar-thumb: #444;
            --scrollbar-thumb-hover: #555;
            --shadow-inset: rgba(0, 0, 0, 0.5);
            --settings-shadow: rgba(0, 0, 0, 0.45);
        }

        [data-theme="light"] {
            --bg: #f5f7f5;
            --text: #1a1a1a;
            --text-muted: #5a5a5a;
            --text-subtle: #666;
            --accent: #1e5c3e;
            --accent-hover: #174a31;
            --accent-light: #2b8c73;
            --surface: #ffffff;
            --surface-raised: #eef2ee;
            --border: #d0d8d0;
            --border-input: #b8c4b8;
            --placeholder: #999;
            --user-msg-bg: #1e5c3e;
            --user-msg-text: #fff;
            --assistant-msg-bg: #eef2ee;
            --assistant-msg-text: #1a1a1a;
            --btn-disabled-bg: #d0d8d0;
            --btn-disabled-text: #888;
            --scrollbar-track: #eef2ee;
            --scrollbar-thumb: #b8c4b8;
            --scrollbar-thumb-hover: #9aab9a;
            --shadow-inset: rgba(0, 0, 0, 0.06);
            --settings-shadow: rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px 80px;
            color: var(--text);
            background: var(--bg);
            transition: background 0.25s ease, color 0.25s ease;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
        }

        h2 { margin: 0; color: var(--accent); }

        .sub-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        #model-status {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }

        #token-stats {
            font-size: 12px;
            color: var(--text-subtle);
            background: var(--surface-raised);
            padding: 4px 8px;
            border-radius: 4px;
        }

        #chat-box {
            border: 1px solid var(--border);
            background: var(--surface);
            height: 380px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 1px 3px var(--shadow-inset);
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            word-break: break-word;
            font-size: 14px;
        }

        .user {
            background: var(--user-msg-bg);
            color: var(--user-msg-text);
            align-self: flex-end;
        }

        .assistant {
            background: var(--assistant-msg-bg);
            color: var(--assistant-msg-text);
            align-self: flex-start;
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-input);
            background: var(--surface);
            color: var(--text);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--placeholder);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            padding: 0 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        button:disabled {
            background: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            cursor: not-allowed;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 5px;
            text-align: center;
        }

        #loading-subtext {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            text-align: center;
            max-width: 80%;
        }

        .progress-container {
            width: 280px;
            background: var(--surface-raised);
            border-radius: 10px;
            overflow: hidden;
            height: 12px;
            margin-bottom: 10px;
            box-shadow: inset 0 1px 3px var(--shadow-inset);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light), var(--accent));
            background-size: 200% 100%;
            animation: gradientMove 2s linear infinite;
            transition: width 0.2s ease;
        }

        @keyframes gradientMove {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        #progress-stats {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Settings panel — bottom left */
        #settings-root {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
        }

        #settings-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 10px var(--settings-shadow);
        }

        #settings-toggle svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        #settings-panel {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 0;
            width: 260px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 4px 20px var(--settings-shadow);
        }

        #settings-panel.open {
            display: block;
        }

        .settings-section {
            margin-bottom: 16px;
        }

        .settings-section:last-child {
            margin-bottom: 0;
        }

        .settings-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .settings-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .settings-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            background: var(--surface-raised);
            transition: border-color 0.15s, background 0.15s;
        }

        .settings-option:hover {
            border-color: var(--accent);
        }

        .settings-option input {
            accent-color: var(--accent);
            margin: 0;
        }

        .settings-option.active {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, var(--surface-raised));
        }

        .settings-option .option-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: auto;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Preparing Forge Kernel AI</div>
        <div id="loading-subtext">Loading model...</div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="progress-stats">0%</div>
    </div>

    <div class="header-container">
        <h2 id="app-title">Forge Kernel AI</h2>
        <div id="token-stats">Context: 0 / 4,096 tokens</div>
    </div>
    <div class="sub-title">Super-fast client-side intelligence running right inside your browser via WebGPU.</div>

    <div id="model-status"></div>

    <div id="chat-box"></div>

    <div class="input-group">
        <input type="text" id="user-input" placeholder="Ask Forge Kernel AI anything..." disabled>
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>

    <div id="settings-root">
        <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            Settings
        </button>
        <div id="settings-panel" role="dialog" aria-label="Settings">
            <div class="settings-section">
                <span class="settings-label">Theme</span>
                <div class="settings-options" id="theme-options">
                    <label class="settings-option" data-theme-value="light">
                        <input type="radio" name="theme" value="light">
                        Light
                    </label>
                    <label class="settings-option" data-theme-value="dark">
                        <input type="radio" name="theme" value="dark">
                        Dark
                    </label>
                </div>
            </div>
            <div class="settings-section">
                <span class="settings-label">AI Model</span>
                <div class="settings-options" id="model-options">
                    <label class="settings-option" data-model-value="lite">
                        <input type="radio" name="model" value="lite">
                        Fast Lite
                        <span class="option-desc">Qwen3-0.6B</span>
                    </label>
                    <label class="settings-option" data-model-value="fast">
                        <input type="radio" name="model" value="fast">
                        Fast
                        <span class="option-desc">Qwen3-1.7B</span>
                    </label>
                    <label class="settings-option" data-model-value="smart">
                        <input type="radio" name="model" value="smart">
                        Smart
                        <span class="option-desc">Qwen3-4B</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        const MODELS = {
            lite: { id: "Qwen3-0.6B-q4f16_1-MLC", label: "Fast Lite (Qwen3-0.6B)" },
            fast: { id: "Qwen3-1.7B-q4f16_1-MLC", label: "Fast (Qwen3-1.7B)" },
            smart: { id: "Qwen3-4B-q4f16_1-MLC", label: "Smart (Qwen3-4B)" }
        };
        const MODEL_ORDER = ["lite", "fast", "smart"];

        const STORAGE_KEYS = { theme: "forge-kernel-theme", model: "forge-kernel-model" };
        const maxWindow = 4096;

        let engine = null;
        let backendConfig = null;
        let targetModelKey = localStorage.getItem(STORAGE_KEYS.model) || "fast";
        let currentModelKey = "lite";
        let isSwitchingModel = false;
        let backgroundUpgradeAbort = false;

        const loadingOverlay = document.getElementById("loading-overlay");
        const loadingText = document.getElementById("loading-text");
        const loadingSubtext = document.getElementById("loading-subtext");
        const progressBar = document.getElementById("progress-bar");
        const progressStats = document.getElementById("progress-stats");
        const modelStatus = document.getElementById("model-status");
        const tokenStats = document.getElementById("token-stats");
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const settingsToggle = document.getElementById("settings-toggle");
        const settingsPanel = document.getElementById("settings-panel");

        let conversationHistory = [];

        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            localStorage.setItem(STORAGE_KEYS.theme, theme);
            document.querySelectorAll("#theme-options .settings-option").forEach(el => {
                const active = el.dataset.themeValue === theme;
                el.classList.toggle("active", active);
                el.querySelector("input").checked = active;
            });
        }

        function modelRank(modelKey) {
            return MODEL_ORDER.indexOf(modelKey);
        }

        function applyModelSelectionUI(modelKey) {
            document.querySelectorAll("#model-options .settings-option").forEach(el => {
                const active = el.dataset.modelValue === modelKey;
                el.classList.toggle("active", active);
                el.querySelector("input").checked = active;
            });
        }

        function saveModelPreference(modelKey) {
            targetModelKey = modelKey;
            localStorage.setItem(STORAGE_KEYS.model, modelKey);
            applyModelSelectionUI(modelKey);
        }

        function showLoadingOverlay(message) {
            loadingText.innerText = "Preparing Forge Kernel AI";
            loadingSubtext.innerText = message;
            progressBar.style.width = "0%";
            progressStats.innerText = "0%";
            loadingOverlay.style.display = "flex";
            loadingOverlay.style.opacity = "1";
        }

        function hideLoadingOverlay() {
            loadingOverlay.style.opacity = "0";
            setTimeout(() => {
                loadingOverlay.style.display = "none";
            }, 400);
        }

        function showModelStatus(text, persist = false) {
            modelStatus.style.display = "block";
            modelStatus.style.color = "var(--accent)";
            modelStatus.innerText = text;
            if (!persist) {
                setTimeout(() => {
                    modelStatus.style.display = "none";
                }, 4000);
            }
        }

        async function createEngine(modelKey, onProgress) {
            const model = MODELS[modelKey];
            return webllm.CreateMLCEngine(model.id, {
                initProgressCallback: (report) => {
                    if (onProgress) onProgress(report);
                }
            });
        }

        async function loadEngine(modelKey, { showOverlay = true, savePreference = true } = {}) {
            const model = MODELS[modelKey];
            if (!model) return;

            if (showOverlay) {
                showLoadingOverlay(`Loading ${model.label}...`);
                userInput.disabled = true;
                sendBtn.disabled = true;
            }

            engine = await createEngine(modelKey, (report) => {
                if (!showOverlay) return;
                loadingSubtext.innerText = report.text;
                if (report.progress !== undefined) {
                    const percent = Math.round(report.progress * 100);
                    progressBar.style.width = percent + "%";
                    progressStats.innerText = percent + "%";
                }
            });

            currentModelKey = modelKey;
            if (savePreference) saveModelPreference(modelKey);

            if (showOverlay) hideLoadingOverlay();
            userInput.disabled = false;
            sendBtn.disabled = false;
        }

        async function backgroundUpgradeTo(modelKey) {
            if (modelRank(modelKey) <= modelRank(currentModelKey)) return;

            backgroundUpgradeAbort = false;
            modelStatus.style.display = "block";
            modelStatus.style.color = "var(--accent)";

            const upgradeProgressCallback = (report) => {
                if (backgroundUpgradeAbort) return;
                const shortText = report.text.split("] ")[1] || report.text;
                modelStatus.innerText = `Downloading ${MODELS[modelKey].label} in background: ${shortText}`;
            };

            try {
                const upgradedEngine = await createEngine(modelKey, upgradeProgressCallback);
                if (backgroundUpgradeAbort) return;

                engine = upgradedEngine;
                currentModelKey = modelKey;

                modelStatus.style.color = "var(--accent-light)";
                modelStatus.innerText = `Upgrade complete — now using ${MODELS[modelKey].label}.`;
                setTimeout(() => {
                    modelStatus.style.display = "none";
                }, 5000);
            } catch (err) {
                console.error("Background upgrade failed:", err);
                if (!backgroundUpgradeAbort) {
                    modelStatus.innerText = `Background upgrade failed — still on ${MODELS[currentModelKey].label}.`;
                    setTimeout(() => {
                        modelStatus.style.display = "none";
                    }, 5000);
                }
            }
        }

        async function switchModel(modelKey) {
            if (modelKey === targetModelKey && modelKey === currentModelKey) return;
            if (isSwitchingModel) return;

            isSwitchingModel = true;
            backgroundUpgradeAbort = true;
            settingsPanel.classList.remove("open");
            saveModelPreference(modelKey);

            try {
                if (modelKey === currentModelKey) return;

                showModelStatus(`Switching to ${MODELS[modelKey].label}...`, true);
                await loadEngine(modelKey, { showOverlay: true, savePreference: false });
                conversationHistory = [];
                chatBox.innerHTML = "";
                tokenStats.innerText = `Context: 0 / ${maxWindow.toLocaleString()} tokens`;
                modelStatus.style.color = "var(--accent-light)";
                showModelStatus(`Now using ${MODELS[modelKey].label}.`);
            } catch (err) {
                console.error(err);
                showModelStatus("Failed to switch model.", true);
            } finally {
                isSwitchingModel = false;
            }
        }

        function initSettings() {
            const savedTheme = localStorage.getItem(STORAGE_KEYS.theme) || "dark";
            applyTheme(savedTheme);
            applyModelSelectionUI(targetModelKey);

            settingsToggle.addEventListener("click", (e) => {
                e.stopPropagation();
                const open = settingsPanel.classList.toggle("open");
                settingsToggle.setAttribute("aria-expanded", open);
            });

            document.addEventListener("click", (e) => {
                if (!document.getElementById("settings-root").contains(e.target)) {
                    settingsPanel.classList.remove("open");
                    settingsToggle.setAttribute("aria-expanded", "false");
                }
            });

            document.querySelectorAll("#theme-options .settings-option").forEach(el => {
                el.addEventListener("click", () => applyTheme(el.dataset.themeValue));
            });

            document.querySelectorAll("#model-options .settings-option").forEach(el => {
                el.addEventListener("click", () => switchModel(el.dataset.modelValue));
            });
        }

        async function initApp() {
            try {
                document.title = "Forge Kernel AI";

                const response = await fetch("./prompt-config.json");
                if (!response.ok) throw new Error("Failed to load prompt-config.json");
                backendConfig = await response.json();

                initSettings();

                // Always boot with the smallest model for a fast first load
                await loadEngine("lite", { showOverlay: true, savePreference: false });

                // Then silently upgrade to the user's preferred smarter model
                if (modelRank(targetModelKey) > modelRank("lite")) {
                    backgroundUpgradeTo(targetModelKey);
                }
            } catch (err) {
                console.error(err);
                loadingSubtext.innerText = "Initialization error.";
                progressStats.innerText = "Error";
            }
        }

        initApp();

        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text || !engine || !backendConfig) return;

            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            conversationHistory.push({ role: "user", content: text });
            appendMessage(text, "user");

            const messages = [
                { role: "system", content: backendConfig.system_prompt },
                ...conversationHistory
            ];

            const assistantMsgDiv = appendMessage("", "assistant");
            const modelId = MODELS[currentModelKey].id;

            try {
                const replyStream = await engine.chat.completions.create({
                    messages: messages,
                    temperature: backendConfig.temperature,
                    max_tokens: backendConfig.max_output_tokens,
                    stream: true,
                    stream_options: { include_usage: true },
                    extra_body: modelId.startsWith("Qwen3")
                        ? { enable_thinking: false }
                        : undefined
                });

                let fullReply = "";
                let currentUsage = null;

                for await (const chunk of replyStream) {
                    const delta = chunk.choices[0]?.delta?.content || "";
                    fullReply += delta;
                    assistantMsgDiv.innerText = stripThinkingContent(fullReply);
                    chatBox.scrollTop = chatBox.scrollHeight;

                    if (chunk.usage) {
                        currentUsage = chunk.usage;
                    }
                }

                fullReply = stripThinkingContent(fullReply);
                assistantMsgDiv.innerText = fullReply;
                conversationHistory.push({ role: "assistant", content: fullReply });

                if (currentUsage && currentUsage.total_tokens) {
                    const used = currentUsage.total_tokens;
                    const pct = ((used / maxWindow) * 100).toFixed(1);
                    tokenStats.innerText = `Context: ${used.toLocaleString()} / ${maxWindow.toLocaleString()} tokens (${pct}%)`;
                }
            } catch (err) {
                console.error(err);
                assistantMsgDiv.innerText = "[Generation error]";
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        };

        function stripThinkingContent(text) {
            let cleaned = text;
            // Remove complete blocks: <think>...</think>
            cleaned = cleaned.replace(/<think>[\s\S]*?<\/redacted_thinking>/gi, "");
            // Remove blocks delimited by the same tag twice: <think>...<think>
            cleaned = cleaned.replace(/<think>[\s\S]*?<think>/gi, "");
            // While streaming, hide any incomplete thinking block at the end
            cleaned = cleaned.replace(/<think>[\s\S]*$/gi, "");
            return cleaned.trim();
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
